spring:
  application:
    name: route-navigator

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/route_navigatordb}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:admin}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: ${PORT:8080}

mapbox:
  base-url: https://api.mapbox.com
  access-token: ${MAPBOX_ACCESS_TOKEN:}
