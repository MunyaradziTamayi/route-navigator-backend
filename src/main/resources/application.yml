spring:
  application:
    name: route-navigator

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:route_navigatordb}}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:admin}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true

app:
  public-url: ${APP_PUBLIC_URL:}

google:
  api-key: ${GOOGLE_API_KEY:}
  routes-base-url: https://routes.googleapis.com
  geocoding-base-url: https://maps.googleapis.com
  route-matrix-batch-delay-ms: ${GOOGLE_ROUTE_MATRIX_BATCH_DELAY_MS:5}
  route-matrix-elements-per-minute: ${GOOGLE_ROUTE_MATRIX_ELEMENTS_PER_MINUTE:2500}

  security:
    user:
      name: admin
      password: admin123
