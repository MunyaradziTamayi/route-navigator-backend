spring:
  application:
    name: route-navigator

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/route_navigatordb}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:admin}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: ${PORT:8080}

google:
  api-key: ${GOOGLE_API_KEY:}
  routes-base-url: https://routes.googleapis.com
  geocoding-base-url: https://maps.googleapis.com
