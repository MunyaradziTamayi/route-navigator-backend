name: Keep Render Awake

on:
  schedule:
    # Render free instances sleep after 15 min of inactivity
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            https://route-navigator-backend.onrender.com/api/health
