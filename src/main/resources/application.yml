spring:
  application:
    name: route-navigator

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routenavs}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:admin}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: ${PORT:8080}

osrm:
  base-url: http://router.project-osrm.org

nominatim:
  base-url: https://nominatim.openstreetmap.org

